name: Moim_O checks
on:
  push:
    paths:
      - "app.js"
      - "auth.js"
      - "index.html"
      - "style.css"
      - "server/**"
      - ".github/workflows/moimo-test.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript module syntax checks
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < auth.js
          node --input-type=module --check < server/src/index.js
      - name: Interface elements and API routes
        run: |
          grep -q 'id="join-pin"' index.html
          grep -q 'id="saved-meetings"' index.html
          grep -q 'id="room-delete"' index.html
          grep -q '/api/my/rooms' app.js
          grep -q 'path.endsWith("/join")' server/src/index.js
          grep -q 'path === "/owner/delete"' server/src/index.js
