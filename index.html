<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="6명의 모임 시간을 함께 확인하는 일정표">
  <title>모임 시간표</title>
  <link rel="stylesheet" href="style.css">
  <script src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="shell">
    <section id="login-screen" class="login-screen">
      <div class="login-card">
        <h1>모임 시간표</h1>
        <form id="login-form" autocomplete="off">
          <label for="name-select">이름</label>
          <select id="name-select" required>
            <option value="" selected disabled>이름 선택</option>
            <option value="kimdeok">김덕중</option>
            <option value="kimwon">김원일</option>
            <option value="kimjeong">김정님</option>
            <option value="wooseong">우성민</option>
            <option value="leeun">이은정</option>
            <option value="cheonyun">천윤호</option>
          </select>
          <label for="pin-input">번호 끝 4자리</label>
          <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" placeholder="0000" required>
          <button id="login-button" class="primary-button" type="submit">입장</button>
          <p id="login-error" class="error-text" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="app-screen" class="app-screen hidden" aria-label="시간표">
      <header class="topbar">
        <div>
          <h1>모임 시간표</h1>
          <p class="period">11월 20일(금) – 25일(수)</p>
        </div>
        <button id="logout-button" class="outline-button" type="button">나가기</button>
      </header>

      <nav id="member-tabs" class="tabs" aria-label="사람별 시간표"></nav>
      <div class="working-area">
        <div class="panel-heading">
          <h2 id="panel-title"></h2>
          <span id="panel-status" class="muted" aria-live="polite"></span>
        </div>

        <div id="brush-tools" class="brush-tools hidden" role="group" aria-label="시간표 색 선택">
          <button type="button" class="brush active" data-brush="both" aria-pressed="true"><span class="paint-dot green"></span>온·오프라인</button>
          <button type="button" class="brush" data-brush="online" aria-pressed="false"><span class="paint-dot yellow"></span>온라인만</button>
          <button type="button" class="brush erase" data-brush="erase" aria-pressed="false">지우기</button>
        </div>

        <div id="legend" class="legend hidden" aria-label="표시 색상">
          <span><span class="paint-dot green"></span>온·오프라인</span>
          <span><span class="paint-dot yellow"></span>온라인만</span>
        </div>

        <div id="day-picker" class="day-picker hidden" aria-label="날짜 선택"></div>
        <div id="calendar-container" class="calendar-container"></div>
      </div>
    </section>
  </main>
</body>
</html>
