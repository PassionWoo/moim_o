<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Moim_O</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<main class="app">
<header class="header">
  <a class="wordmark" href="./">Moim_O</a>
  <button id="home-btn" class="small-button hidden" type="button">나가기</button>
</header>

<section id="start-view" class="hero">
  <h1>우리 지금 만나!</h1>
  <button id="create-open" class="big-button" type="button">모임 만들기 <span>＋</span></button>
</section>

<section id="create-view" class="hidden form">
 <h1>모임 만들기</h1>
 <div class="field">
  <label for="title">모임 이름</label>
  <input id="title" maxlength="80" placeholder="모임 이름">
 </div>
 <div class="field">
  <div class="field-head"><label>참석자</label><span id="member-count">4명</span></div>
  <div id="member-inputs" class="member-inputs"></div>
  <button id="add-member" class="add-member" type="button">＋</button>
 </div>
 <div class="field">
  <label>날짜</label>
  <div class="calendar-head">
   <button id="month-prev" type="button" aria-label="이전 달">‹</button>
   <strong id="month-label"></strong>
   <button id="month-next" type="button" aria-label="다음 달">›</button>
  </div>
  <div id="calendar" class="calendar-grid"></div>
  <div id="range-label" class="range-label"></div>
 </div>
 <div class="field">
   <label for="unit">시간 단위</label>
   <div class="input-row">
    <input id="unit" type="number" min="1" max="720" value="3" inputmode="decimal">
    <select id="unit-type" aria-label="단위"><option value="hours">시간</option><option value="minutes">분</option></select>
   </div>
 </div>
 <div class="field">
  <label>하루 시간</label>
  <div class="input-row">
   <select id="time-from" aria-label="시작 시간"></select>
   <span>~</span>
   <select id="time-to" aria-label="끝 시간"></select>
  </div>
 </div>
 <button id="create-submit" class="big-button" type="button">모임 만들기</button>
 <p id="create-error" class="error" role="alert"></p>
</section>

<section id="share-view" class="hidden">
 <h1>모임 생성 완료</h1>
 <div id="share-name" class="subhead"></div>
 <div class="share-list" id="share-list"></div>
 <button id="share-dashboard" class="big-button" type="button">대시보드 보기</button>
</section>

<section id="room-view" class="hidden">
 <div class="room-head">
   <div><h1 id="room-name"></h1><div id="room-subtitle" class="subhead"></div></div>
   <button id="copy-current" class="small-button" type="button">링크 복사</button>
 </div>
 <div id="tabs" class="tabs"></div>
 <div class="tab-head"><h2 id="tab-name"></h2><span id="status" aria-live="polite"></span></div>
 <div id="brushes" class="brushes hidden">
  <button type="button" data-brush="both" class="brush selected"><span class="dot green"></span> 온·오프라인</button>
  <button type="button" data-brush="online" class="brush"><span class="dot yellow"></span> 온라인만</button>
  <button type="button" data-brush="erase" class="brush">지우기</button>
 </div>
 <div id="legend" class="legend hidden">
  <span><i class="dot green"></i> 온·오프라인</span><span><i class="dot yellow"></i> 온라인만</span>
 </div>
 <div id="day-controls" class="day-controls hidden">
  <button id="day-prev" type="button">‹</button><strong id="day-label"></strong><button id="day-next" type="button">›</button>
 </div>
 <div id="table-wrap" class="table-wrap"></div>
 <div id="manager-panel" class="manager-panel hidden">
  <h2>공유 링크</h2>
  <div id="manager-links" class="share-list"></div>
 </div>
</section>
<div id="toast" class="toast hidden" role="status"></div>
</main>
</body>
</html>
