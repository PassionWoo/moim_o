<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>모이모 (Moim_O)</title>
<link rel="stylesheet" href="style.css?v=20261121-no-recovery1">
<script src="config.js?v=20261121-1"></script>
<script type="module" src="app.js?v=20261121-owner-and-join1"></script>
</head>
<body>
<main class="app">
<header class="header">
  <a class="wordmark" href="./">모이모 <small>Moim_O</small></a>
  <button id="home-btn" class="small-button hidden" type="button">나가기</button>
</header>

<section id="start-view" class="hero">
  <h1>우리 지금 만나!</h1>
  <button id="create-open" class="big-button" type="button">모임 만들기 <span>＋</span></button>
  <div id="owner-account" class="owner-account">
   <button id="google-login" class="small-button" type="button">팀장 로그인 · 회원가입</button>
   <div id="owner-info" class="hidden account-bar">
    <span id="owner-name"></span>
    <button id="google-logout" type="button" class="small-button">로그아웃</button>
   </div>
  </div>
  <section id="saved-meetings" class="saved-meetings hidden">
   <h2>내 모임</h2>
   <div id="saved-meetings-list" class="saved-meetings-list"></div>
  </section>
</section>

<section id="account-view" class="hidden form">
 <h1>팀장 로그인</h1>
 <div class="auth-modes">
  <button type="button" id="auth-login-mode" class="small-button selected">로그인</button>
  <button type="button" id="auth-register-mode" class="small-button">회원가입</button>
 </div>
 <div class="field"><label for="account-username">아이디</label>
  <input id="account-username" maxlength="24" autocomplete="username" placeholder="아이디 3~24자"></div>
 <div class="field"><label for="account-password">비밀번호</label>
  <input id="account-password" type="password" minlength="8" maxlength="128" autocomplete="current-password" placeholder="8자 이상"></div>
 <button id="account-submit" class="big-button" type="button">로그인</button>
 <p id="account-error" class="error" role="alert"></p>
</section>
<section id="admin-view" class="hidden admin-view">
 <div class="room-head"><h1>모이모 최고관리자</h1><button id="admin-refresh" class="small-button" type="button">새로고침</button></div>
 <p class="subhead">Cloudflare에서 설정한 관리자 비밀키가 있어야 전체 현황을 볼 수 있습니다.</p>
 <div class="field"><label for="admin-key">최고관리자 비밀키</label>
  <input id="admin-key" type="password" autocomplete="off" placeholder="Cloudflare MOIMO_ADMIN_KEY">
 </div>
 <button id="admin-connect" class="big-button" type="button">관리자 인증 및 전체 조회</button>
 <p id="admin-status" class="error" role="alert"></p>
 <div id="admin-dashboard" class="hidden">
  <div id="admin-stats" class="admin-stats"></div>
  <h2>전체 모임</h2><div id="admin-rooms" class="saved-meetings-list"></div>
  <h2>전체 팀장 계정</h2><div id="admin-accounts" class="saved-meetings-list"></div>
  <div class="field"><label for="admin-lookup">기존 계정 직접 찾기</label>
   <div class="input-row"><input id="admin-lookup" placeholder="아이디"><button id="admin-find" class="small-button" type="button">찾기</button></div>
  </div>
  <div id="admin-inspection"></div>
 </div>
</section>
<section id="join-view" class="hidden form">
 <h1 id="join-room-title">모임 참여</h1>
 <div class="field">
   <label for="join-name">이름</label>
   <select id="join-name"><option value="">이름 선택</option></select>
 </div>
 <div class="field">
   <label for="join-pin">전화번호 끝 4자리</label>
   <input id="join-pin" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="0000">
 </div>
 <button id="join-submit" class="big-button" type="button">입장하기</button>
 <p id="join-error" class="error" role="alert"></p>
</section>
<section id="create-view" class="hidden form">
 <h1>모임 만들기</h1>
 <div class="field">
  <label for="title">모임 이름</label>
  <input id="title" maxlength="80" placeholder="모임 이름">
 </div>
 <div class="field">
  <label for="owner-participant-name">팀장 이름</label>
  <input id="owner-participant-name" maxlength="30" placeholder="팀장 본인의 이름">
  <p class="retention-note">모임을 생성한 팀장도 참석자로 포함되며, 본인 일정을 직접 입력할 수 있습니다.</p>
 </div>
 <div class="field">
  <div class="field-head"><label>다른 참석자</label><span id="member-count">4명</span></div>
  <div id="member-inputs" class="member-inputs"></div>
  <button id="add-member" class="add-member" type="button">＋</button>
 </div>
 <div class="field">
  <label>날짜</label>
  <div class="calendar-head">
   <button id="month-prev" type="button" aria-label="이전 달">‹</button>
   <strong id="month-label"></strong>
   <button id="month-next" type="button" aria-label="다음 달">›</button>
  </div>
  <div id="calendar" class="calendar-grid"></div>
  <div id="range-label" class="range-label"></div>
 </div>
 <div class="field">
   <label for="unit">시간 단위</label>
   <div class="input-row">
    <input id="unit" type="number" min="1" max="720" value="3" inputmode="decimal">
    <select id="unit-type" aria-label="단위"><option value="hours">시간</option><option value="minutes">분</option></select>
   </div>
 </div>
 <div class="field">
  <label>하루 시간</label>
  <div class="input-row">
   <select id="time-from" aria-label="시작 시간"></select>
   <span>~</span>
   <select id="time-to" aria-label="끝 시간"></select>
  </div>
 </div>
 <p class="retention-note">모임은 생성일로부터 60일 후 자동 삭제됩니다.</p>
 <button id="create-submit" class="big-button" type="button">모임 만들기</button>
 <p id="create-error" class="error" role="alert"></p>
</section>

<section id="share-view" class="hidden">
 <h1>모임 생성 완료</h1>
 <div id="share-name" class="subhead"></div>
 <p class="retention-note">공통 모임 링크 하나만 팀원들에게 공유하세요. 생성일로부터 60일 후 모임이 자동 삭제됩니다.</p>
 <div class="share-list" id="share-list"></div>
 <button id="share-dashboard" class="big-button" type="button">대시보드 보기</button>
</section>

<section id="room-view" class="hidden">
 <div class="room-head">
   <div><h1 id="room-name"></h1><div id="room-subtitle" class="subhead"></div></div>
   <button id="copy-current" class="small-button" type="button">모임 링크 복사하기</button>
 </div>
 <div id="tabs" class="tabs"></div>
 <div class="tab-head"><h2 id="tab-name"></h2><span id="status" aria-live="polite"></span></div>
 <div id="brushes" class="brushes hidden">
  <button type="button" data-brush="both" class="brush selected"><span class="dot green"></span> 온·오프라인</button>
  <button type="button" data-brush="online" class="brush"><span class="dot yellow"></span> 온라인만</button>
  <button type="button" data-brush="erase" class="brush">지우기</button>
 </div>
 <div id="legend" class="legend hidden">
  <span><i class="dot green"></i> 온·오프라인</span><span><i class="dot yellow"></i> 온라인만</span>
 </div>
 <div id="day-controls" class="day-controls hidden">
  <button id="day-prev" type="button">‹</button><strong id="day-label"></strong><button id="day-next" type="button">›</button>
 </div>
 <div id="table-wrap" class="table-wrap"></div>
 <div id="manager-panel" class="manager-panel hidden">
  <h2>공유 링크</h2>
  <div id="manager-links" class="share-list"></div>
  <button id="room-delete" class="small-button delete-button" type="button">모임 삭제</button>
 </div>
</section>
<div id="toast" class="toast hidden" role="status"></div>
</main>
</body>
</html>
